name: Fedora Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  # Manual runs also publish the RPM to GitHub Releases.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Required to create the tag and the release on a manual run.
permissions:
  contents: write

env:
  # Must be >= the kdeplasma-addons version that first ships the Ion API (>= 6.5).
  # Also used to derive the source tarball URL by cmake/PlasmaIonsChinaIonHeadersTarget.cmake.
  # Keep it in sync with the version argument in the top-level CMakeLists.txt.
  ION_HEADERS_VERSION: "6.6.4"

jobs:
  fedora:
    name: Build on Fedora
    runs-on: ubuntu-latest
    # Fedora 44 or newer is required: CMakeLists.txt needs CMake 4.0 and the
    # PlasmaWeather Ion API needs the headers shipped by kdeplasma-addons >= 6.5.
    container: fedora:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          # ion_headers externally configures the whole kdeplasma-addons, so its full
          # Qt6/KF6/Plasma development dependency closure must be installed, even though
          # this project only consumes a few headers from it. Fedora splits all headers
          # into -devel packages.
          # qml, quick3d, core5compat and holidays are not used directly: they are
          # requested by kdeplasma-addons or through find_dependency() in
          # PlasmaWeatherConfig.cmake and must be present.
          # libsodium-devel is only needed by the qweather ion.
          dnf --assumeyes install \
            cmake \
            extra-cmake-modules \
            gcc-c++ \
            git \
            gettext \
            ninja-build \
            qt6-qtbase-devel \
            qt6-qtdeclarative-devel \
            qt6-qt5compat-devel \
            qt6-qtquick3d-devel \
            kf6-kholidays-devel \
            kf6-kcoreaddons-devel \
            kf6-ki18n-devel \
            kf6-kunitconversion-devel \
            libplasma-devel \
            kf6-kauth-devel \
            kf6-kcmutils-devel \
            kf6-kconfig-devel \
            kf6-kconfigwidgets-devel \
            kf6-kdbusaddons-devel \
            kf6-kdeclarative-devel \
            kf6-kglobalaccel-devel \
            kf6-kiconthemes-devel \
            kf6-kio-devel \
            kf6-kirigami-addons-devel \
            kf6-kitemmodels-devel \
            kf6-kjobwidgets-devel \
            kf6-knewstuff-devel \
            kf6-knotifications-devel \
            kf6-kpackage-devel \
            kf6-krunner-devel \
            kf6-kservice-devel \
            kf6-ksvg-devel \
            kf6-kwidgetsaddons-devel \
            kf6-kxmlgui-devel \
            kf6-purpose-devel \
            kf6-sonnet-devel \
            kdeplasma-addons-devel \
            libsodium-devel

      - name: Trust the workspace for git
        run: |
          # The container runs as root while the workspace is owned by the runner
          # user, so git refuses to touch it with "detected dubious ownership"
          # (exit code 128). This must come after git is installed above and before
          # the first git command in this job, which is the archive in Build RPM.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install RPM tooling
        run: |
          # gh is used to publish the release on manual runs.
          dnf --assumeyes install rpm-build dnf-plugins-core gh

      - name: Configure
        run: |
          # PLASMA_IONS_CHINA_VERSION is passed explicitly on purpose: without a
          # valid `vX.Y.Z` git tag the top-level CMakeLists.txt aborts configuration,
          # and this repository has no tags at all.
          cmake -B build -S . \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPLASMA_IONS_CHINA_VERSION="${ION_HEADERS_VERSION}" \
            -DPLASMA_IONS_CHINA_ENABLE_MODERN=ON \
            -DPLASMA_IONS_CHINA_ENABLE_LEGACY=OFF

      - name: Build
        run: cmake --build build

      # qweather has no credentials here and is skipped by upstream design,
      # so only nmccn is asserted. The RPM builds into its own directory, so
      # this is checked in the plain build tree instead.
      - name: Verify built ion
        run: |
          ion="$(find build -name 'nmccn.so' | head -n1)"
          test -n "$ion" || { echo "::error::nmccn.so was not built"; exit 1; }
          echo "Built: $ion"

      - name: Build RPM
        run: |
          # The spec is the single source of truth for the package metadata and
          # for its BuildRequires, which are resolved below instead of being
          # duplicated in this workflow.
          set -o pipefail
          # Locate the repository root explicitly rather than trusting the current
          # working directory: a bare `git archive` here once failed with
          # "not a git repository".
          echo "cwd=$(pwd) workspace=${GITHUB_WORKSPACE:-unset}"
          cd "${GITHUB_WORKSPACE:-$(pwd)}"
          repo_root="$(git rev-parse --show-toplevel)"
          echo "repo_root=$repo_root"
          cd "$repo_root"
          mkdir -p rpmbuild/BUILD rpmbuild/BUILDROOT rpmbuild/RPMS \
                   rpmbuild/SOURCES rpmbuild/SPECS rpmbuild/SRPMS
          version="$(sed -n 's/^%global ion_headers_version //p' plasma-ions-china.spec)"
          test -n "$version" || { echo "::error::cannot read version from spec"; exit 1; }
          # Source0 points at a vX.Y.Z tag, but packaging must not depend on one
          # existing, so the archive is generated from the checkout instead.
          git archive --format=tar.gz \
            --prefix="plasma-ions-china-v${version}/" \
            -o "rpmbuild/SOURCES/plasma-ions-china-v${version}.tar.gz" HEAD
          cp plasma-ions-china.spec rpmbuild/SPECS/
          dnf builddep --assumeyes -y rpmbuild/SPECS/plasma-ions-china.spec
          rpmbuild -bb rpmbuild/SPECS/plasma-ions-china.spec \
            --define "_rpmdir $PWD/rpmbuild/RPMS" \
            --define "_sourcedir $PWD/rpmbuild/SOURCES" \
            --define "_specdir $PWD/rpmbuild/SPECS" \
            --define "_builddir $PWD/rpmbuild/BUILD" \
            --define "_buildrootdir $PWD/rpmbuild/BUILDROOT" \
            --define "_srcrpmdir $PWD/rpmbuild/SRPMS" \
            --define "_topdir $PWD/rpmbuild"
          find rpmbuild/RPMS -name '*.rpm' -exec rpm -qip {} \;

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: rpmbuild/RPMS/**/*.rpm
          if-no-files-found: error

      - name: Publish release
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -n 's/^%global ion_headers_version //p' plasma-ions-china.spec)"
          test -n "$version" || { echo "::error::cannot read version from spec"; exit 1; }
          echo "Publishing v${version}"
          mapfile -t rpms < <(find rpmbuild/RPMS -name '*.rpm')
          test "${#rpms[@]}" -gt 0 || { echo "::error::no RPM to publish"; exit 1; }
          if gh release view "v${version}" >/dev/null 2>&1; then
            gh release upload "v${version}" "${rpms[@]}" --clobber
          else
            gh release create "v${version}" "${rpms[@]}" \
              --title "v${version}" \
              --generate-notes
          fi
