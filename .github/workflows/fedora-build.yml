name: Fedora Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Must be >= the kdeplasma-addons version that first ships the Ion API (>= 6.5).
  # Also used to derive the source tarball URL by cmake/PlasmaIonsChinaIonHeadersTarget.cmake.
  # Keep it in sync with the version argument in the top-level CMakeLists.txt.
  ION_HEADERS_VERSION: "6.6.4"

jobs:
  build:
    name: Build on Fedora
    runs-on: ubuntu-latest
    # Fedora 44 or newer is required: CMakeLists.txt needs CMake 4.0 and the
    # PlasmaWeather Ion API needs the headers shipped by kdeplasma-addons >= 6.5.
    container: fedora:latest
    steps:
      - name: Install build dependencies
        run: |
          # ion_headers externally configures the whole kdeplasma-addons, so its full
          # Qt6/KF6/Plasma development dependency closure must be installed, even though
          # this project only consumes a few headers from it. Fedora splits all headers
          # into -devel packages.
          # qml, quick3d, core5compat and holidays are not used directly: they are
          # requested by kdeplasma-addons or through find_dependency() in
          # PlasmaWeatherConfig.cmake and must be present.
          # libsodium-devel is only needed by the qweather ion.
          dnf --assumeyes install \
            cmake \
            extra-cmake-modules \
            gcc-c++ \
            git \
            gettext \
            ninja-build \
            qt6-qtbase-devel \
            qt6-qtdeclarative-devel \
            qt6-qt5compat-devel \
            qt6-qtquick3d-devel \
            kf6-kholidays-devel \
            kf6-kcoreaddons-devel \
            kf6-ki18n-devel \
            kf6-kunitconversion-devel \
            libplasma-devel \
            kf6-kauth-devel \
            kf6-kcmutils-devel \
            kf6-kconfig-devel \
            kf6-kconfigwidgets-devel \
            kf6-kdbusaddons-devel \
            kf6-kdeclarative-devel \
            kf6-kglobalaccel-devel \
            kf6-kiconthemes-devel \
            kf6-kio-devel \
            kf6-kirigami-addons-devel \
            kf6-kitemmodels-devel \
            kf6-kjobwidgets-devel \
            kf6-knewstuff-devel \
            kf6-knotifications-devel \
            kf6-kpackage-devel \
            kf6-krunner-devel \
            kf6-kservice-devel \
            kf6-ksvg-devel \
            kf6-kwidgetsaddons-devel \
            kf6-kxmlgui-devel \
            kf6-purpose-devel \
            kf6-sonnet-devel \
            kdeplasma-addons-devel \
            libsodium-devel

      - uses: actions/checkout@v4

      - name: Configure
        run: |
          # PLASMA_IONS_CHINA_VERSION is passed explicitly on purpose: without a
          # valid `vX.Y.Z` git tag the top-level CMakeLists.txt aborts configuration,
          # and this repository has no tags at all.
          cmake -B build -S . \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPLASMA_IONS_CHINA_VERSION="${ION_HEADERS_VERSION}" \
            -DPLASMA_IONS_CHINA_ENABLE_MODERN=ON \
            -DPLASMA_IONS_CHINA_ENABLE_LEGACY=OFF

      - name: Build
        run: cmake --build build

      - name: Install
        run: cmake --install build

      # qweather has no credentials here and is skipped by upstream design,
      # so only nmccn is asserted.
      - name: Verify installed ion
        run: |
          ion="$(find /usr -name 'nmccn.so' 2>/dev/null | head -n1)"
          test -n "$ion" || { echo "::error::nmccn.so was not installed"; exit 1; }
          echo "Installed: $ion"

  package:
    name: Build RPM
    # Serialised on purpose: packaging only starts once the build job has finished
    # successfully, so the two jobs never run at the same time.
    needs: build
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install packaging tools
        run: dnf --assumeyes install rpm-build dnf-plugins-core gzip git
      - uses: actions/checkout@v4

      - name: Trust the workspace for git
        run: |
          # The container runs as root while the workspace is owned by the runner
          # user, so git refuses to touch it with "detected dubious ownership"
          # (exit code 128).
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Prepare source archive
        id: prep
        continue-on-error: true
        run: |
          # Source0 points at a vX.Y.Z tag that does not exist yet, so the archive
          # is built from the checkout instead. No version tag has to exist.
          # git was installed above and is only needed for this step.
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE"
          mkdir -p rpmbuild/BUILD rpmbuild/BUILDROOT rpmbuild/RPMS \
                   rpmbuild/SOURCES rpmbuild/SPECS rpmbuild/SRPMS
          version="$(sed -n 's/^%global ion_headers_version //p' plasma-ions-china.spec)"
          test -n "$version" || { echo "::error::cannot read version from spec"; exit 1; }
          git rev-parse --is-inside-work-tree
          git archive --format=tar.gz \
            --prefix="plasma-ions-china-v${version}/" \
            -o "rpmbuild/SOURCES/plasma-ions-china-v${version}.tar.gz" HEAD
          cp plasma-ions-china.spec rpmbuild/SPECS/
          # Later steps append their output here so that one artifact carries the
          # whole story, since job logs cannot be fetched without admin rights.
          { echo "prep_outcome=${{ steps.prep.outcome }}"; echo "workspace=$GITHUB_WORKSPACE"; \
            echo "### git"; git rev-parse HEAD; echo "### files"; ls -la; ls -laR rpmbuild; \
          } > prep-diagnostics.txt 2>&1 || true
      - name: Install BuildRequires from spec
        run: |
          # The spec is the single source of truth for build dependencies, so the
          # list is resolved here instead of being duplicated in this workflow.
          dnf builddep --assumeyes -y rpmbuild/SPECS/plasma-ions-china.spec \
            2>&1 | tee -a prep-diagnostics.txt

      - name: Build RPM
        run: |
          set -o pipefail
          rpmbuild -bb rpmbuild/SPECS/plasma-ions-china.spec \
            --define "_rpmdir $PWD/rpmbuild/RPMS" \
            --define "_sourcedir $PWD/rpmbuild/SOURCES" \
            --define "_specdir $PWD/rpmbuild/SPECS" \
            --define "_builddir $PWD/rpmbuild/BUILD" \
            --define "_buildrootdir $PWD/rpmbuild/BUILDROOT" \
            --define "_srcrpmdir $PWD/rpmbuild/SRPMS" \
            --define "_topdir $PWD/rpmbuild" \
            2>&1 | tee -a prep-diagnostics.txt

      - name: Show produced package
        run: |
          mapfile -t rpms < <(find rpmbuild/RPMS -name '*.rpm')
          test "${#rpms[@]}" -gt 0 || { echo "::error::no RPM was produced"; exit 1; }
          rpm -qip "${rpms[0]}"
          rpm -qlp "${rpms[0]}"

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: rpmbuild/RPMS/**/*.rpm
          if-no-files-found: error

      # Runs last so the artifact also contains the builddep and rpmbuild output
      # appended by the steps above; the job log itself cannot be fetched without
      # admin rights, so this file is the debugging channel.
      - name: Collect diagnostics
        if: always()
        run: |
          {
            echo; echo "### final state"
            echo "prep_outcome=${{ steps.prep.outcome }}"
            echo "pwd=$(pwd)"
            ls -la
            find rpmbuild -name '*.rpm' 2>/dev/null
            echo; echo "### diagnostics file (tail)"
            tail -n 60 prep-diagnostics.txt 2>/dev/null || echo "no diagnostics file"
          } >> prep-diagnostics.txt 2>&1 || true
          tail -n 80 prep-diagnostics.txt

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prep-diagnostics
          path: prep-diagnostics.txt
          if-no-files-found: warn
